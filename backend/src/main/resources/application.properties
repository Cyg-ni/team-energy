spring.application.name=bill-ocr-service
server.port=8080

# Shared team database on Supabase Postgres. Values come from your own local
# environment variables - see SPEC.md "Environment setup" for what to set and where.
# Use the Direct connection string (port 5432), not the Transaction pooler (6543):
# Hibernate/HikariCP's prepared-statement caching doesn't play well with PgBouncer
# transaction mode.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# create-drop would wipe the shared database every time anyone restarts the app - never use
# it here. update is a pragmatic capstone-timeline choice over a full migration tool (Flyway/
# Liquibase); it won't drop or rename columns, so review generated DDL if you change a field type.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.sql.init.platform=postgres
# Let Hibernate create tables before data.sql inserts into them.
spring.jpa.defer-datasource-initialization=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.storage.upload-dir=uploads

# Gemini - OCR engine. aistudio.google.com (not console.cloud.google.com - a separate,
# no-billing-required product): sign in, "Get API key", create one. Required only when
# /api/bills/extract is actually called, not at startup - the rest of the app works without it.
app.gemini.api-key=${GEMINI_API_KEY:}
# Model history, each entry hit for real during testing, not guessed:
#   gemini-1.5-flash    -> stopped existing entirely (confirmed via GET v1beta/models)
#   gemini-flash-latest -> resolved, but hit real 503 SERVICE_UNAVAILABLE (newest = most contested)
#   gemini-2.5-flash    -> resolved, then Google deprecated it for new users mid-project,
#                          with the 404 response explicitly naming gemini-3.6-flash as the replacement
# If this one also stops working: GET v1beta/models?key=... and filter for entries where
# supportedGenerationMethods includes generateContent - that list is the only real source of
# truth, not this comment. gemini-flash-latest is worth reconsidering too, now that 503s are
# auto-retried (see GeminiOcrTextExtractor) - a pinned version is what's actually been going stale.
app.gemini.model=gemini-3.6-flash

# Supabase Storage - durable copy of uploaded bill files (private bucket).
# app.supabase.url is the project's API URL shown on the Supabase dashboard,
# e.g. https://<project-ref>.supabase.co (not the Postgres connection string).
# Blank defaults on purpose: unlike the database, storage is allowed to be unconfigured -
# uploads still work locally (see FileStorageService), they just won't sync to Supabase yet.
app.supabase.url=${SUPABASE_URL:}
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.supabase.storage-bucket=bill-documents

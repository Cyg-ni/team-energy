# Offline fallback for solo work when you haven't set up Supabase env vars yet, or Supabase
# is unreachable. Run with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# Data here is NOT shared with the team and resets every restart.
spring.datasource.url=jdbc:h2:mem:billocr;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.sql.init.platform=h2

# No Supabase Storage locally - files just stay on disk in app.storage.upload-dir.
app.supabase.url=
app.supabase.service-role-key=
